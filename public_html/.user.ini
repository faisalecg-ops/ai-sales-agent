; -------------------------------------------------------------------
; PHP settings for this site.
;
; The document importer accepts brochures and price lists, and an
; exhibition brochure is commonly 2-5 MB. Many shared hosts leave the
; upload limit at 2 MB, which is smaller than the files people actually
; have, so it is raised here.
;
; Most cPanel servers (PHP-FPM or CGI) read this file. Some ignore it,
; in which case use MultiPHP INI Editor in cPanel instead, or paste the
; document text into the importer rather than uploading the file.
; Changes can take a few minutes to take effect.
; -------------------------------------------------------------------

upload_max_filesize = 16M
post_max_size = 20M

; Reading several documents in one request is avoided by design, but a
; large PDF still needs a moment.
max_execution_time = 120
memory_limit = 256M
